<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="index, follow" />

    <title>The Cool Axolotl - Création de sites web sur mesure</title>

    <!-- SEO Meta Tags -->
    <meta
      name="description"
      content="The Cool Axolotl, création de sites web sur mesure avec React et WordPress. Basé à Montpellier, je réalise des sites vitrines performants et modernes."
    />
    <meta
      name="keywords"
      content="Web Designer Montpellier, création site web, site vitrine, WordPress, React, design web, freelance, The Cool Axolotl"
    />
    <meta name="author" content="The Cool Axolotl" />

    <!-- Open Graph / Facebook -->
    <meta
      property="og:title"
      content="The Cool Axolotl - Création de sites web sur mesure"
    />
    <meta
      property="og:description"
      content="Web Designer à Montpellier, développeur en sites web sur mesure avec WordPress et React."
    />
    <meta
      property="og:image"
      content="https://thecoolaxolotl.com/axolotllogo.webp"
    />
    <meta property="og:image:alt" content="logo The Cool Axolotl" />
    <meta property="og:url" content="https://thecoolaxolotl.com" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="The Cool Axolotl" />
    <meta property="og:locale" content="fr_FR" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta
      name="twitter:title"
      content="The Cool Axolotl - Création de sites web sur mesure"
    />
    <meta
      name="twitter:description"
      content="Web Designer à Montpellier, développeur en sites vitrines modernes et performants."
    />
    <meta
      name="twitter:image"
      content="https://thecoolaxolotl.com/axolotllogo.webp"
    />
    <meta name="twitter:image:alt" content="logo The Cool Axolotl" />

    <!-- Canonical & Hreflang -->
    <link rel="canonical" href="https://thecoolaxolotl.com" />
    <link rel="alternate" hreflang="fr-FR" href="https://thecoolaxolotl.com" />

    <!-- Favicon -->
    <link rel="icon" href="/favicon.ico" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />

    <!-- Preload Local Fonts -->
    <link
      rel="preload"
      href="/Fonts/Quicksand-Regular.woff2"
      as="font"
      type="font/woff2"
      crossorigin="anonymous"
    />
    <link
      rel="preload"
      href="/Fonts/Quicksand-500.woff2"
      as="font"
      type="font/woff2"
      crossorigin="anonymous"
    />

    <!-- HEAD -->
    <style>
      #font-preload-check::before {
        content: "Aa";
        font-family: "Quicksand", sans-serif;
        font-weight: 400;
        position: absolute;
        width: 0;
        height: 0;
        overflow: hidden;
        white-space: nowrap;
        visibility: hidden;
      }

      #font-preload-check::after {
        content: "Bb";
        font-family: "Quicksand", sans-serif;
        font-weight: 500;
        position: absolute;
        width: 0;
        height: 0;
        overflow: hidden;
        white-space: nowrap;
        visibility: hidden;
      }

      /* Skip link accessible */
      .skip-link {
        position: absolute;
        top: -40px;
        left: 0;
        background: #000;
        color: #fff;
        padding: 8px 16px;
        z-index: 10000;
        text-decoration: none;
        font-weight: bold;
        transition: top 0.3s ease;
      }
      .skip-link:focus {
        top: 0;
      }
      main:focus {
        outline: 3px solid #172c66;
        outline-offset: 5px;
      }
    </style>

    <!-- Styles -->
    <link
      rel="stylesheet"
      href="/assets/styles.css"
      media="print"
      onload="this.media='all'"
    />
    <noscript><link rel="stylesheet" href="/assets/styles.css" /></noscript>
    <link rel="preload" as="image" href="/assests/Pics/axolotllogo.webp" />
    <link rel="preload" as="image" href="/assests/Pics/algue.webp" />
    <!-- Content Security Policy -->
    <meta
      http-equiv="Content-Security-Policy"
      content="
        default-src 'self';
        script-src 'self' 'unsafe-inline' https://kit.fontawesome.com https://unpkg.com https://vercel.live;
        style-src 'self' 'unsafe-inline' https://ka-f.fontawesome.com;
        img-src 'self' data: https://thecoolaxolotl.com https://unpkg.com;
        font-src 'self' https://ka-f.fontawesome.com;
        connect-src 'self' https://ka-f.fontawesome.com https://api.emailjs.com;"
    />
  </head>

  <body>
    <!-- Lien d’ancrage pour accès rapide au contenu -->
    <a href="#main-content" class="skip-link">Aller au contenu principal</a>

    <!-- Navigation -->
    <nav role="navigation" aria-label="Menu principal">
      <ul>
        <li><a href="#parcours" class="navbar-item">Parcours</a></li>
        <li><a href="#portfolio" class="navbar-item">Portfolio</a></li>
        <li><a href="#services" class="navbar-item">Services</a></li>
        <li><a href="#contact" class="navbar-item">Contact</a></li>
      </ul>
    </nav>

    <!-- Contenu principal -->
    <main id="main-content" tabindex="-1">
      <section id="parcours" tabindex="0">
        <h2>Parcours</h2>
        <p>Mon parcours professionnel et expérience.</p>
      </section>

      <section id="portfolio" tabindex="0">
        <h2>Portfolio</h2>
        <p>Exemples de réalisations.</p>
      </section>

      <section id="services" tabindex="0">
        <h2>Services</h2>
        <p>Présentation des services proposés.</p>
      </section>

      <section id="contact" tabindex="0">
        <h2>Contact</h2>
        <p>Formulaire et informations de contact.</p>
      </section>
    </main>

    <div id="font-preload-check" aria-hidden="true"></div>

    <!-- Main Script -->
    <script type="module" src="/src/main.jsx" defer></script>
  </body>
</html>
